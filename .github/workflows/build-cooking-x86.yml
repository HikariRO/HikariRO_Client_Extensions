name: Build x86 client extension

on:
  push:
    branches:
      - hro_cooking_system
      - hro_bestiary_ui_test
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build ddraw.dll
        shell: cmd
        run: |
          cd HRO_Fishing_UI
          cl /nologo /O2 /LD /MT /W3 ddraw.c miniz.c miniz_tdef.c miniz_tinfl.c miniz_zip.c /link /DEF:ddraw.def /OUT:..\ddraw.dll user32.lib gdi32.lib msimg32.lib ws2_32.lib
      - name: Scan compiled DLL with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Resolve-Path './ddraw.dll').Path
          $defender = Get-Command Start-MpScan -ErrorAction SilentlyContinue
          if (-not $defender) {
            throw 'Microsoft Defender is not available on this runner; refusing to publish an unscanned DLL.'
          }
          # Hosted Windows runners can fail to download signatures transiently.
          # Do not skip scanning: retry the update, then use the locally
          # installed signatures only when they are present and recent.
          $updated = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Update-MpSignature -ErrorAction Stop
              $updated = $true
              break
            } catch {
              Write-Warning "Defender signature update attempt $attempt failed: $_"
              if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
            }
          }
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) {
            throw 'Microsoft Defender antivirus or real-time protection is disabled.'
          }
          if (-not $updated) {
            $age = (Get-Date) - $status.AntivirusSignatureLastUpdated
            if (-not $status.AntivirusSignatureVersion -or $age.TotalDays -gt 7 -or $age.TotalSeconds -lt 0) {
              throw "Defender signature update failed and installed signatures are unavailable or stale: $age"
            }
            Write-Warning "Signature update unavailable; scanning with installed signatures ($($status.AntivirusSignatureVersion), age $($age.TotalHours.ToString('F1')) hours)."
          }
          Start-MpScan -ScanType CustomScan -ScanPath $dll -ErrorAction Stop
          $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            ($_.Resources -join ' ') -like '*ddraw.dll*'
          })
          if ($detections.Count -gt 0) {
            $detections | Format-List | Out-String | Write-Host
            throw 'Microsoft Defender reported a detection in ddraw.dll; artifact publication stopped.'
          }
          Write-Host 'Defender scan completed with no detections for ddraw.dll.'
      - name: Prepare DLL with SHA-256 manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item ddraw.dll package/ddraw.dll
          (Get-FileHash package/ddraw.dll -Algorithm SHA256).Hash.ToLowerInvariant() + "  ddraw.dll" | Set-Content package/SHA256SUMS.txt
          @"
          HikariRO Bestiary test DLL
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          File: ddraw.dll (Windows x86)
          Verify SHA256 against SHA256SUMS.txt before installing.
          Close HikariRO and back up the existing DLL first.
          "@ | Set-Content package/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HikariRO-Bestiary-x86-${{ github.ref_name }}
          path: package/
          if-no-files-found: error
